# cert-manager : émetteur « vault », PKI de Vault (rôle traefik : services publiés sous pcc.inside.esipe-creteil.info, data lake datalake.pcc.internal et *.datalake.pcc.internal).
# Authentification AppRole ; identifiant secret et CA PCC dans le secret vault-approle (voir README).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault
spec:
  vault:
    server: https://vault01.pcc.internal:8200
    path: pki_int/sign/traefik
    caBundleSecretRef:
      name: vault-approle
      key: ca.crt
    auth:
      appRole:
        path: approle
        roleId: __ROLE_ID__
        secretRef:
          name: vault-approle
          key: secretId
---
# Certificats clients MQTT (rôle Vault mqtt-client : CN = nom du compte RabbitMQ, ex. train-mock), même AppRole
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-mqtt
spec:
  vault:
    server: https://vault01.pcc.internal:8200
    path: pki_int/sign/mqtt-client
    caBundleSecretRef:
      name: vault-approle
      key: ca.crt
    auth:
      appRole:
        path: approle
        roleId: __ROLE_ID__
        secretRef:
          name: vault-approle
          key: secretId
