apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pcc-public
  namespace: traefik
spec:
  secretName: pcc-public-tls
  issuerRef:
    kind: ClusterIssuer
    name: vault
  commonName: pcc.inside.esipe-creteil.info
  dnsNames:
    - pcc.inside.esipe-creteil.info
    - vault.pcc.inside.esipe-creteil.info
    - graylog.pcc.inside.esipe-creteil.info
    - rabbitmq.pcc.inside.esipe-creteil.info
    - vault.pcc.internal
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
