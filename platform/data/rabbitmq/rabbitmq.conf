# /etc/rabbitmq/rabbitmq.conf

listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/pcc-tls/ca.pem
ssl_options.certfile   = /etc/pcc-tls/rabbitmq.crt
ssl_options.keyfile    = /etc/pcc-tls/rabbitmq.key
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = false

mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic
mqtt.ssl_cert_login = true
ssl_cert_login_from = common_name

management.ssl.port       = 15671
management.ssl.cacertfile = /etc/pcc-tls/ca.pem
management.ssl.certfile   = /etc/pcc-tls/rabbitmq.crt
management.ssl.keyfile    = /etc/pcc-tls/rabbitmq.key
