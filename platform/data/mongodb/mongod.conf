# /etc/mongod.conf
storage:
  dbPath: /data/mongodb
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/pcc-tls/mongodb.pem
    CAFile: /etc/pcc-tls/ca.pem
    allowConnectionsWithoutCertificates: true
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
replication:
  replSetName: rs0
security:
  authorization: enabled
  clusterAuthMode: x509
