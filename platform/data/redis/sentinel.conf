# /etc/redis/sentinel.conf : remplacer __REDIS_PASSWORD__, __HOST__ (nom du nœud) et __MASTER__ (nom du maître actuel)
bind 0.0.0.0

port 0
tls-port 26379
tls-cert-file /etc/pcc-tls/redis.crt
tls-key-file /etc/pcc-tls/redis.key
tls-ca-cert-file /etc/pcc-tls/ca.pem
tls-auth-clients optional
tls-replication yes

protected-mode no
logfile /var/log/redis/redis-sentinel.log
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel announce-ip __HOST__.pcc.internal
sentinel monitor pcc __MASTER__ 6379 2
sentinel auth-pass pcc __REDIS_PASSWORD__
sentinel down-after-milliseconds pcc 5000
sentinel failover-timeout pcc 60000
