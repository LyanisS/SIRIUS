# /etc/redis/redis.conf : remplacer __REDIS_PASSWORD__, __HOST__ (nom du nœud) et __MASTER__ (nom du maître actuel).
bind 0.0.0.0

port 0
tls-port 6379
tls-cert-file /etc/pcc-tls/redis.crt
tls-key-file /etc/pcc-tls/redis.key
tls-ca-cert-file /etc/pcc-tls/ca.pem
tls-auth-clients optional
tls-replication yes

dir /var/lib/redis
appendonly yes
logfile /var/log/redis/redis-server.log
requirepass __REDIS_PASSWORD__
masterauth __REDIS_PASSWORD__

replica-announce-ip __HOST__.pcc.internal
replicaof __MASTER__ 6379
