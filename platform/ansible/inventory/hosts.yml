all:
  children:
    reseau:
      vars:
        vm_folder: "🌐 Réseau"
        net: infra
        nics: ["{{ episen_network }}", "{{ networks.trunk.portgroup }}"]
        user_data: user-data-gateway.yml.j2
        vlans: "{{ networks | dict2items | rejectattr('key', 'eq', 'trunk') | list }}"
      hosts:
        gateway01: { display_name: "🌐 Gateway/DNS gateway01 - PCC - SIRIUS", ansible_host: 192.168.10.2, cpu: 2, mem: 2048, disk: 20, vrrp_priority: 150 }
        gateway02: { display_name: "🌐 Gateway/DNS gateway02 - PCC - SIRIUS", ansible_host: 192.168.10.3, cpu: 2, mem: 2048, disk: 20, vrrp_priority: 100 }
    infra:
      vars: { vm_folder: "🏗️ Infrastructure", net: infra }
      hosts:
        keycloak01: { display_name: "🔑 Keycloak keycloak01 - PCC - SIRIUS", ansible_host: 192.168.10.11, cpu: 2, mem: 4096, disk: 40 }
        graylog01:  { display_name: "📊 Graylog graylog01 - PCC - SIRIUS", ansible_host: 192.168.10.12, cpu: 4, mem: 8192, disk: 40, data_disk: 200 }
        vault01:    { display_name: "🔒 Vault vault01 - PCC - SIRIUS", ansible_host: 192.168.10.13, cpu: 2, mem: 2048, disk: 40 }
        data01:     { display_name: "🗄️ Data data01 - PCC - SIRIUS", ansible_host: 192.168.10.21, cpu: 4, mem: 8192, disk: 40, data_disk: 200 }
        data02:     { display_name: "🗄️ Data data02 - PCC - SIRIUS", ansible_host: 192.168.10.22, cpu: 4, mem: 8192, disk: 40, data_disk: 200 }
        data03:     { display_name: "🗄️ Data data03 - PCC - SIRIUS", ansible_host: 192.168.10.23, cpu: 4, mem: 8192, disk: 40, data_disk: 200 }
    k8s:
      vars: { vm_folder: "☸️ Kubernetes", net: k8s }
      hosts:
        k8s-cp01:     { display_name: "🎛️ Kubernetes Control Plane k8s-cp01 - PCC - SIRIUS", ansible_host: 192.168.20.11, cpu: 2, mem: 4096, disk: 50 }
        k8s-cp02:     { display_name: "🎛️ Kubernetes Control Plane k8s-cp02 - PCC - SIRIUS", ansible_host: 192.168.20.12, cpu: 2, mem: 4096, disk: 50 }
        k8s-cp03:     { display_name: "🎛️ Kubernetes Control Plane k8s-cp03 - PCC - SIRIUS", ansible_host: 192.168.20.13, cpu: 2, mem: 4096, disk: 50 }
        k8s-worker01: { display_name: "⚙️ Kubernetes Worker k8s-worker01 - PCC - SIRIUS", ansible_host: 192.168.20.21, cpu: 4, mem: 8192, disk: 100 }
        k8s-worker02: { display_name: "⚙️ Kubernetes Worker k8s-worker02 - PCC - SIRIUS", ansible_host: 192.168.20.22, cpu: 4, mem: 8192, disk: 100 }
        k8s-worker03: { display_name: "⚙️ Kubernetes Worker k8s-worker03 - PCC - SIRIUS", ansible_host: 192.168.20.23, cpu: 4, mem: 8192, disk: 100 }
    data:
      vars: { vm_folder: "🗃️ Data", net: data }
      hosts:
        datalake01:      { display_name: "🪣 Data Lake datalake01 - PCC - SIRIUS", ansible_host: 192.168.40.11, cpu: 2, mem: 4096, disk: 40, data_disk: 200 }
        datawarehouse01: { display_name: "🏛️ Data Warehouse datawarehouse01 - PCC - SIRIUS", ansible_host: 192.168.40.12, cpu: 2, mem: 4096, disk: 40, data_disk: 200 }
    trains:
      vars: { vm_folder: "🚆 Trains", net: trains }
      hosts:
        trains-mock01: { display_name: "🚆 trains-mock - PCC - SIRIUS", ansible_host: 192.168.30.11, cpu: 2, mem: 2048, disk: 40 }
